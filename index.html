<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>RMS Dashboard - Appart'Hôtel</title>
  <!-- Tailwind CSS pour le style visuel -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PapaParse pour lire le Google Sheet en CSV -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 p-6 md:p-10">

  <div class="max-w-6xl mx-auto space-y-6">
    <!-- En-tête -->
    <header class="flex justify-between items-center border-b pb-4">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">Tableau de Bord Revenue Management</h1>
        <p class="text-sm text-slate-500">Données synchronisées en direct avec Google Sheets</p>
      </div>
      <button onclick="chargerDonnees()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-4 py-2 rounded-lg shadow transition">
        Actualiser
      </button>
    </header>

    <!-- Cartes KPI -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
        <span class="text-xs font-semibold text-slate-400 uppercase">CA Total</span>
        <div id="kpi-ca" class="text-2xl font-bold text-slate-900 mt-1">-- €</div>
      </div>
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
        <span class="text-xs font-semibold text-slate-400 uppercase">Taux d'Occupation (TO)</span>
        <div id="kpi-to" class="text-2xl font-bold text-indigo-600 mt-1">-- %</div>
      </div>
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
        <span class="text-xs font-semibold text-slate-400 uppercase">Prix Moyen (PM)</span>
        <div id="kpi-pm" class="text-2xl font-bold text-slate-900 mt-1">-- €</div>
      </div>
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
        <span class="text-xs font-semibold text-slate-400 uppercase">RevPAR</span>
        <div id="kpi-revpar" class="text-2xl font-bold text-emerald-600 mt-1">-- €</div>
      </div>
    </div>

    <!-- Tableau de données -->
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
      <div class="p-4 border-b border-slate-100">
        <h2 class="font-semibold text-slate-800">Détail journalier</h2>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-50 text-slate-500 border-b">
            <tr>
              <th class="p-3">Date</th>
              <th class="p-3">Hôtel</th>
              <th class="p-3 text-right">Dispos</th>
              <th class="p-3 text-right">Louées</th>
              <th class="p-3 text-right">TO</th>
              <th class="p-3 text-right">PM</th>
              <th class="p-3 text-right">RevPAR</th>
              <th class="p-3 text-right">CA</th>
            </tr>
          </thead>
          <tbody id="table-body" class="divide-y divide-slate-100">
            <tr>
              <td colspan="8" class="p-4 text-center text-slate-400">Chargement des données...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // ⚠️ REMPLACEZ CETTE VALEUR PAR L'ID DE VOTRE PROPRE FEUILLE GOOGLE SHEET :
    const SHEET_ID = "12ekO09L9P_lhEdLrzyba-gOo5p8B2CQpJAnO6l44_J4";
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;

    async function chargerDonnees() {
      Papa.parse(CSV_URL, {
        download: true,
        header: true,
        dynamicTyping: true,
        complete: function(results) {
          const data = results.data.filter(row => row.Date); // ignore les lignes vides
          calculerEtAfficher(data);
        },
        error: function(err) {
          alert("Erreur lors de la lecture du Google Sheet. Vérifiez le partage public.");
        }
      });
    }

    function calculerEtAfficher(data) {
      let totalCA = 0;
      let totalDispos = 0;
      let totalLouees = 0;
      const tbody = document.getElementById("table-body");
      tbody.innerHTML = "";

      data.forEach(row => {
        const ca = Number(row.CA_Hebergement) || 0;
        const dispos = Number(row.Chambres_Total) || 0;
        const louees = Number(row.Chambres_Louees) || 0;

        const to = dispos > 0 ? (louees / dispos) * 100 : 0;
        const pm = louees > 0 ? ca / louees : 0;
        const revpar = dispos > 0 ? ca / dispos : 0;

        totalCA += ca;
        totalDispos += dispos;
        totalLouees += louees;

        tbody.innerHTML += `
          <tr class="hover:bg-slate-50">
            <td class="p-3 font-medium">${row.Date}</td>
            <td class="p-3">${row.Hotel || '-'}</td>
            <td class="p-3 text-right">${dispos}</td>
            <td class="p-3 text-right">${louees}</td>
            <td class="p-3 text-right font-medium text-indigo-600">${to.toFixed(1)}%</td>
            <td class="p-3 text-right">${pm.toFixed(2)} €</td>
            <td class="p-3 text-right font-medium text-emerald-600">${revpar.toFixed(2)} €</td>
            <td class="p-3 text-right font-semibold">${ca.toLocaleString('fr-FR')} €</td>
          </tr>
        `;
      });

      // Calcul des moyennes globales
      const toMoyen = totalDispos > 0 ? (totalLouees / totalDispos) * 100 : 0;
      const pmMoyen = totalLouees > 0 ? totalCA / totalLouees : 0;
      const revparMoyen = totalDispos > 0 ? totalCA / totalDispos : 0;

      // Mise à jour des cartes KPI
      document.getElementById("kpi-ca").innerText = totalCA.toLocaleString('fr-FR') + " €";
      document.getElementById("kpi-to").innerText = toMoyen.toFixed(1) + " %";
      document.getElementById("kpi-pm").innerText = pmMoyen.toFixed(2) + " €";
      document.getElementById("kpi-revpar").innerText = revparMoyen.toFixed(2) + " €";
    }

    // Charger les données dès l'ouverture de la page
    window.onload = chargerDonnees;
  </script>
</body>
</html>
